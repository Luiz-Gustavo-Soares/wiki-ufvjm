{% extends 'core/base.html' %}

{% block title %}Entrar - Wiki UFVJM{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">Bem-vindo de volta!</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Usuário ou senha incorretos. Tente novamente.
                        </div>
                    {% endif %}

                    {{ form.as_p }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p>Ainda não faz parte da Wiki? <a href="{% url 'accounts:registro' %}" class="text-decoration-none">Crie uma conta</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
